<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Truth or Dare</title>
    <!-- Import Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            margin-top: 50px;
        }
        #game-screen { display: none; }
        .hidden { display: none !important; }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            transition: 0.2s;
        }
        button:hover { background-color: #2980b9; }
        
        input {
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            margin-bottom: 20px;
        }
        
        #prompt-box {
            font-size: 28px;
            font-weight: bold;
            margin: 30px;
            color: #f1c40f;
            padding: 20px;
            border: 2px dashed #f1c40f;
            border-radius: 10px;
            display: inline-block;
        }
        
        #turn-indicator { color: #e74c3c; font-size: 24px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <h1>Truth or Dare</h1>
        <input type="text" id="username" placeholder="Enter your name"><br>
        <button onclick="joinGame()">Join Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <h3>Players in room: <span id="player-list" style="color: #2ecc71;"></span></h3>
        <h2 id="turn-indicator"></h2>

        <!-- TRUTH OR DARE BUTTONS -->
        <div id="choosing-section" class="hidden">
            <button onclick="chooseAction('truth')">Truth</button>
            <button onclick="chooseAction('dare')" style="background-color: #e67e22;">Dare</button>
        </div>

        <!-- THE QUESTION/DARE DISPLAY -->
        <div id="answering-section" class="hidden">
            <div id="prompt-box"></div><br>
            <button id="next-turn-btn" onclick="nextTurn()">Next Turn</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myUsername = "";

        // 1. Join the game
        function joinGame() {
            const input = document.getElementById('username');
            if(input.value.trim() !== "") {
                myUsername = input.value.trim();
                socket.emit('join_game', myUsername);
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
            }
        }

        // 2. Send choice to server
        function chooseAction(action) {
            socket.emit('choose_action', { choice: action });
        }

        // 3. Move to next player
        function nextTurn() {
            socket.emit('next_turn');
        }

        // 4. LISTEN FOR SYNC UPDATES FROM SERVER
        socket.on('state_update', function(state) {
            
            // Update the player list on screen
            document.getElementById('player-list').innerText = state.players.join(', ');

            // Tell the user whose turn it is
            const turnIndicator = document.getElementById('turn-indicator');
            if (state.current_turn === myUsername) {
                turnIndicator.innerText = "It's YOUR turn! Make a choice.";
            } else {
                turnIndicator.innerText = "Waiting for " + state.current_turn + " to choose...";
            }

            const choosingSec = document.getElementById('choosing-section');
            const answeringSec = document.getElementById('answering-section');
            const nextBtn = document.getElementById('next-turn-btn');

            // If a player is deciding between Truth or Dare
            if (state.status === 'choosing') {
                answeringSec.classList.add('hidden');
                
                // Only show the buttons if it is THIS browser's turn
                if (state.current_turn === myUsername) {
                    choosingSec.classList.remove('hidden');
                } else {
                    choosingSec.classList.add('hidden');
                }
            } 
            // If a player has chosen and is doing the Truth/Dare
            else if (state.status === 'answering') {
                choosingSec.classList.add('hidden');
                answeringSec.classList.remove('hidden');
                
                // Display the random question
                document.getElementById('prompt-box').innerText = state.current_prompt;
                
                // Only the person playing can click "Next Turn"
                if (state.current_turn === myUsername) {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
